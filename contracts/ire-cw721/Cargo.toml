[package]
name = "ire-cw721"
version = "0.1.0"
edition = "2021"
description = "NFT contract for Ire's Blockchain, built on cw721-base. Deploy with --no-admin for permanent immutability."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cosmwasm-std = "1.5"
cosmwasm-schema = "1.5"
cw721 = "0.18"
cw721-base = { version = "0.18", features = ["library"] }
schemars = "0.8"
serde = { version = "1.0", features = ["derive"] }

[profile.release]
opt-level = "z"
debug = false
lto = true
