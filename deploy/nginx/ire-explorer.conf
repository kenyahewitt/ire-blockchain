# TLS-only, read-only IRE explorer proxy for Netlify.
# RPC (26657) and LCD (1317) stay bound to localhost. The public site never
# relays broadcasts, signing, administrative RPC, peer IPs, or dial requests.
limit_req_zone $binary_remote_addr zone=ire_rpc:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name rpc.boomer250.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rpc.boomer250.com;

    ssl_certificate /etc/letsencrypt/live/rpc.boomer250.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rpc.boomer250.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    server_tokens off;
    client_max_body_size 1m;
    limit_req zone=ire_rpc burst=20 nodelay;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Explicit denials even if a future allowlist grows.
    location ~* /(unsafe|net_info|dial_) {
        return 404;
    }

    # /rpc/<allowlisted> -> http://127.0.0.1:26657/<path>  (strip /rpc)
    location ~ ^/rpc/(status|block|blockchain|validators|unconfirmed_txs|num_unconfirmed_txs|tx|abci_info)$ {
        if ($request_method != GET) { return 405; }
        rewrite ^/rpc/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:26657;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # /api/cosmos/{bank,staking,mint,tx,auth,base,distribution}/... -> http://127.0.0.1:1317/...
    location ~ ^/api/(cosmos/(bank|staking|mint|tx|auth|base|distribution)/) {
        if ($request_method != GET) { return 405; }
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:1317;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location / {
        return 404;
    }
}
