# GET-only explorer proxy. RPC (26657) and LCD (1317) stay bound to
# localhost on the VPS. Netlify reverse-proxies /rpc/ and /api/ here.
# Do not expose broadcast, unsafe RPC, or net_info (peer IPs).
limit_req_zone $binary_remote_addr zone=ire_rpc:10m rate=10r/s;

# Port 80: origin for Netlify's proxy (and any HTTP GET client).
server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Access-Control-Allow-Origin "https://illustrious-banoffee-92cafd.netlify.app" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Accept, Content-Type" always;

    if ($request_method = OPTIONS) { return 204; }
    if ($request_method != GET) { return 405; }

    # Explicit denials even if a future allowlist grows.
    location ~* /(broadcast_tx|unsafe|net_info) {
        return 404;
    }

    # Strip /rpc so CometBFT sees /status, /block, ...
    location ~ ^/rpc/(status|block|blockchain|validators|unconfirmed_txs|num_unconfirmed_txs|tx|abci_info)$ {
        limit_req zone=ire_rpc burst=20 nodelay;
        rewrite ^/rpc/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:26657;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_read_timeout 15s;
    }

    # Strip /api so LCD sees /cosmos/...
    location ~ ^/api/cosmos/(bank|staking|mint|tx)/ {
        limit_req zone=ire_rpc burst=20 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:1317;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_read_timeout 15s;
    }

    location / {
        return 404;
    }
}

