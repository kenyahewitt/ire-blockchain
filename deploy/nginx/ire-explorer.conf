# Replace rpc.example.org with a DNS name you control, then obtain TLS with
# certbot. This proxy deliberately exposes only read-only GET endpoints.
limit_req_zone $binary_remote_addr zone=ire_rpc:10m rate=10r/s;

server {
    listen 443 ssl http2;
    server_name rpc.example.org;

    # TLS certificate directives are managed by certbot.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Access-Control-Allow-Origin "https://illustrious-banoffee-92cafd.netlify.app" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;

    if ($request_method = OPTIONS) { return 204; }
    if ($request_method != GET) { return 405; }

    location ~ ^/(status|block|blockchain|validators|abci_query)$ {
        limit_req zone=ire_rpc burst=20 nodelay;
        proxy_pass http://127.0.0.1:26657;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
    }

    location / { return 404; }
}
