# IRE explorer reverse proxy for Netlify.
# RPC (26657) and LCD (1317) stay bound to localhost.
# GET allowlist + POST only for signed-tx broadcast.
# Deny unsafe RPC, net_info (peer IPs), and dial_*.
limit_req_zone $binary_remote_addr zone=ire_rpc:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=ire_broadcast:10m rate=2r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 1m;
    limit_req zone=ire_rpc burst=20 nodelay;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Access-Control-Allow-Origin "https://illustrious-banoffee-92cafd.netlify.app" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Accept, Content-Type" always;

    if ($request_method = OPTIONS) { return 204; }

    # Explicit denials even if a future allowlist grows.
    location ~* /(unsafe|net_info|dial_) {
        return 404;
    }

    # Signed-tx broadcast via CometBFT RPC (POST only).
    location ~ ^/rpc/(broadcast_tx_sync|broadcast_tx_async|broadcast_tx_commit)$ {
        if ($request_method != POST) { return 405; }
        limit_req zone=ire_broadcast burst=4 nodelay;
        rewrite ^/rpc/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:26657;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Signed-tx broadcast via Cosmos LCD (POST). GET remains allowed on this path.
    location = /api/cosmos/tx/v1beta1/txs {
        if ($request_method !~ ^(GET|POST)$) { return 405; }
        limit_req zone=ire_broadcast burst=4 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:1317;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # /rpc/<allowlisted> -> http://127.0.0.1:26657/<path>  (strip /rpc)
    location ~ ^/rpc/(status|block|blockchain|validators|unconfirmed_txs|num_unconfirmed_txs|tx|abci_info)$ {
        if ($request_method != GET) { return 405; }
        rewrite ^/rpc/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:26657;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # /api/cosmos/{bank,staking,mint,tx,auth,base}/... -> http://127.0.0.1:1317/...
    location ~ ^/api/(cosmos/(bank|staking|mint|tx|auth|base)/) {
        if ($request_method != GET) { return 405; }
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:1317;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location / {
        return 404;
    }
}
